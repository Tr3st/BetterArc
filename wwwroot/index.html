<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Progetto1</title>
    <base href="/" />
    <link href="output.css" rel="stylesheet" />
    <link rel="stylesheet" href="Progetto1.styles.css" />
    <link rel="icon" href="data:,">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">
        <style>
            .loading-screen {
                background-color: #0f172a; /* Slate 900 */
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                width: 100vw;
                position: fixed;
                top: 0;
                left: 0;
            }
        </style>
        <div class="loading-screen">
            <img src="trayicon.png" style="width: 64px; opacity: 0.5;" />
        </div>
    </div>

    <script src="_framework/blazor.webview.js"></script>
    <script>
        window.preventScrollOnSliders = () => {
            const mainContent = document.querySelector('.custom-scrollbar');
            if (!mainContent) return;

            mainContent.addEventListener('wheel', (e) => {
                if (e.target.type === 'range') {
                    e.preventDefault();
                }
            }, { passive: false });
        }
    </script>
</body>

</html>
